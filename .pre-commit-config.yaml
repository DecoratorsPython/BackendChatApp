repos:
  - repo: local
    hooks:
      - id: commit-message-check
        name: Validate commit message format
        entry: bash conventions/check-commit-message.sh
        language: system
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: branch-name-check
        name: Validate branch name format
        entry: bash conventions/check-branch-name.sh
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false

  - repo: https://github.com/psf/black
    rev: 25.11.0 
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6  
    hooks:
      - id: ruff-check
        args: ["--fix"]

      - id: ruff-format
